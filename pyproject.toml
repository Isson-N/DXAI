[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dxaqc"
version = "0.1.0"
description = "Контроль качества DXA-исследований (поясница, бедро)"
requires-python = ">=3.11"
dependencies = [
    "pydicom",
    "pylibjpeg",
    "pylibjpeg-libjpeg",
    "pylibjpeg-openjpeg",
    "numpy",
    "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest", "scikit-learn", "pandas"]

[project.scripts]
dxaqc = "dxaqc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
